[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "malayalam-voice-studio"
version = "0.1.0"
description = "Local Malayalam character performance studio"
requires-python = ">=3.11"
dependencies = ["PySide6==6.8.3", "numpy==1.26.4", "scipy==1.15.2", "soundfile==0.13.1", "huggingface-hub>=0.36,<2", "imageio-ffmpeg==0.6.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-qt==4.4.0"]

[project.scripts]
malayalam-voice-studio = "malayalam_voice_studio.app:main"

[tool.setuptools.packages.find]
include = ["malayalam_voice_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires installed local speech model"]
